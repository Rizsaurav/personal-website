    <title>Saurav Rijal — CS @ Texas State</title>

    <script>
      // Anti-flash: resolve theme before first paint. Light is the default —
      // only honor an explicit stored "dark" preference. Do not consult
      // prefers-color-scheme here so first paint is never dark by accident.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
